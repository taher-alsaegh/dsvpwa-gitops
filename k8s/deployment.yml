apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsvpwa
  namespace: dsvpwa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dsvpwa
  template:
    metadata:
      labels:
        app: dsvpwa
    spec:
      containers:
        - name: dsvpwa
          image: ghcr.io/taher-alsaegh/dsvpwa:dev@sha256:b4cabcaa1aa0ac8099b59467bd556079a8196729d97ee0108f8afb1e2f402abc 
          command:
            - python
          args:
            - dsvpwa.py
            - --host
            - "0.0.0.0"
            - --port
            - "65413"
          ports:
            - containerPort: 65413
          env:
            - name: PORT
              value: "65413"

