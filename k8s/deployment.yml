apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsvpwa
  namespace: dsvpwa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsvpwa
  template:
    metadata:
      labels:
        app: dsvpwa
    spec:
      containers:
        - name: dsvpwa
          image: ghcr.io/taher-alsaegh/dsvpwa:dev@sha256:e6b2f7123b5d2d5278adfee48c082760d045dd8bfa0b9aebb6fd53d823c7cd34
          command: ["python"]
	  args: ["--host","0.0.0.0","--port","65413"]
          ports:
            - containerPort: 65413
          env:
            - name: PORT
              value: "65413"

